<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encontro com o Patrimônio · protótipo navegável</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{
  --red:#E8402A; --red-t:#B92E1B; --red-d:#A82616; --red-bg:#FCEAE6;
  --ink:#2B2523; --mut:#6B605C; --bg:#FBF7F4; --bg2:#F6EFEA; --card:#fff; --line:#E7DDD6; --line2:#D6C8BF;
  --mun:#0F766E; --est:#A15C07; --fed:#1D4E89;
  --c1:#1E7A3C; --c2:#4F6B1A; --c3:#9A6700; --c4:#B4531A; --c5:#A82616;
  --ok:#1E7A3C; --ok-bg:#E6F2EA; --warn:#9A6700; --warn-bg:#FBF1DC; --err:#A82616; --err-bg:#FCEAE6;
  --focus:#1D4E89; --r:8px;
}
html{font-size:100%}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;font-size:1rem;line-height:1.5;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--red-t)}
h1,h2,h3{line-height:1.15;margin:0}
img{max-width:100%;display:block}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.5rem;padding:.4rem .9rem;border:1px solid var(--line2);background:#fff;border-radius:var(--r);font-weight:500;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--red-t);color:var(--red-t)}
.btn.pri{background:var(--red-t);border-color:var(--red-t);color:#fff}
.btn.pri:hover{background:var(--red-d);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:2rem;padding:.2rem .6rem;font-size:.875rem}
.btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.mut{color:var(--mut)}
.small{font-size:.875rem}
.tag{display:inline-flex;align-items:center;gap:.3rem;font-size:.75rem;font-weight:600;padding:.1rem .5rem;border-radius:4px;border:1px solid currentColor;line-height:1.5}
.ex{color:var(--warn);background:var(--warn-bg);border-color:#E9CF94}
.sug{color:var(--fed);background:#E8EFF8;border-color:#B7C9E2;border-style:dashed}
.mod{color:var(--mut);background:transparent;border-color:var(--line2);font-weight:500;white-space:nowrap}
.mn{font-size:.6875rem;font-weight:600;color:var(--mut);margin-left:.3rem;letter-spacing:.02em}
.adm-side .mn{color:#B8ABA4;margin-left:auto} .adm-side .cnt+.mn{margin-left:.4rem}
.tec{color:#5A4E49;background:#F1ECE8;border-color:#D8CDC6}
.pat-blk{display:flex;gap:1.25rem;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.25rem;background:#fff;max-width:40rem}
.pat-blk p{margin:.15rem 0}
.mods{list-style:none;margin:0;padding:0;max-width:52rem}
.mods>li{border-top:1px solid var(--line);padding:1.5rem 0}
.mods h2{font-size:1.25rem;margin:.25rem 0 .5rem}
.mods ul{margin:.5rem 0 0;padding-left:1.1rem}
.mods li li{margin:.3rem 0}
.inst{display:inline-flex;align-items:center;gap:.35rem;font-size:.8125rem;font-weight:600}
.inst i{width:.7rem;height:.7rem;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px currentColor}
.inst.mun{color:var(--mun)} .inst.mun i{background:var(--mun)}
.inst.est{color:var(--est)} .inst.est i{background:var(--est)}
.inst.fed{color:var(--fed)} .inst.fed i{background:var(--fed)}
.cons{display:inline-flex;align-items:center;gap:.4rem;font-weight:600;font-size:.875rem}
.cons b{display:inline-grid;place-items:center;width:1.4rem;height:1.4rem;border-radius:4px;color:#fff;font-size:.75rem}
.k1{color:var(--c1)} .k1 b{background:var(--c1)} .k2{color:var(--c2)} .k2 b{background:var(--c2)}
.k3{color:var(--c3)} .k3 b{background:var(--c3)} .k4{color:var(--c4)} .k4 b{background:var(--c4)} .k5{color:var(--c5)} .k5 b{background:var(--c5)}
.selo-pat{display:inline-flex;flex-direction:column;align-items:flex-start;gap:.15rem;font-size:.6875rem;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.selo-pat span{display:grid;place-items:center;min-width:7.5rem;height:2.25rem;border:1px dashed var(--line2);border-radius:6px;background:#fff;font-size:.75rem;text-transform:none;letter-spacing:0;font-weight:500;color:var(--mut);padding:0 .5rem}
#toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);z-index:100;background:var(--ink);color:#fff;padding:.6rem 1rem;border-radius:var(--r);font-size:.9rem;max-width:calc(100vw - 2rem);box-shadow:0 6px 20px rgba(0,0,0,.2)}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;max-width:min(42rem,calc(100vw - 2rem));width:100%;color:var(--ink)}
dialog::backdrop{background:rgba(43,37,35,.55)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.25rem;border-bottom:1px solid var(--line)}
.dlg-b{padding:1.25rem}
.dlg-f{display:flex;justify-content:flex-end;gap:.5rem;padding:1rem 1.25rem;border-top:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.9rem}
.field label,.lbl{font-weight:600;font-size:.875rem}
.field input,.field select,.field textarea{border:1px solid var(--line2);border-radius:6px;padding:.5rem .6rem;background:#fff;min-height:2.5rem;width:100%}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
.ferr{color:var(--err);font-size:.8125rem;font-weight:500;display:flex;gap:.3rem;align-items:center}
.req{color:var(--err)}

/* ===== capa / escolha de perfil ===== */
.capa{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.capa-l{background:var(--red);color:#fff;padding:3rem clamp(1.25rem,5vw,4rem);display:flex;flex-direction:column;gap:1.5rem}
.capa-l .org{font-weight:700;font-size:.875rem;letter-spacing:.06em;text-transform:uppercase}
.capa-l h1{font-size:clamp(2.2rem,5.2vw,4rem);font-weight:700;letter-spacing:-.02em;line-height:1.02}
.capa-l p.lead{font-size:clamp(1.1rem,1.6vw,1.35rem);font-weight:600;max-width:30rem;margin:0}
.capa-l .meta{margin-top:auto;display:flex;flex-wrap:wrap;gap:1.5rem;align-items:flex-end;justify-content:space-between}
.capa-l .meta .selo-pat{color:#fff}
.capa-l .meta .selo-pat span{background:transparent;border-color:rgba(255,255,255,.8);color:#fff}
.capa-l .num{font-size:1rem;font-weight:600}
.capa-l .num b{display:block;font-size:2.4rem;line-height:1}
.capa-r{background:#fff;padding:3rem clamp(1.25rem,4vw,3.5rem);display:flex;flex-direction:column;justify-content:center;gap:1rem}
.capa-r h2{font-size:1.25rem;color:var(--red-t)}
.perfis{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.perfis button{width:100%;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.15rem 1rem;align-items:center;padding:1rem .25rem;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.perfis button:hover{background:var(--bg)}
.perfis b{font-size:1.15rem}
.perfis .d{grid-column:1;color:var(--mut);font-size:.9rem}
.perfis .ar{grid-row:1/3;grid-column:2;color:var(--red-t)}
.perfis .pub b{color:var(--red-t)}
.capa-r .nota{font-size:.8125rem;color:var(--mut);max-width:34rem}

/* ===== cabeçalho público ===== */
.ph{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.5rem 1rem;padding:.5rem 1rem;flex-wrap:wrap}
.logo{display:flex;flex-direction:column;border-left:4px solid var(--red);padding-left:.55rem;text-decoration:none;color:var(--ink);line-height:1.1}
.logo b{font-weight:700;color:var(--red-t);font-size:1rem}
.logo small{font-size:.6875rem;color:var(--mut);font-weight:500}
.ph nav{display:flex;gap:.25rem}
.ph nav a{text-decoration:none;color:var(--ink);font-weight:500;font-size:.9rem;padding:.4rem .6rem;border-radius:6px}
.ph nav a:hover{background:var(--bg)} .ph nav a.on{color:var(--red-t);box-shadow:inset 0 -2px 0 var(--red-t);border-radius:0}
.ph .acts{margin-left:auto;display:flex;gap:.35rem;align-items:center;flex-wrap:wrap}
.perfil-pill{display:inline-flex;align-items:center;gap:.4rem;font-size:.8125rem;border:1px solid var(--line2);border-radius:999px;padding:.25rem .35rem .25rem .7rem;background:var(--bg)}
.perfil-pill b{font-weight:600}
.perfil-pill button{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:.25rem .65rem;cursor:pointer;font-size:.8125rem;font-weight:500}
.search{position:relative;flex:1 1 18rem;max-width:30rem}
.search input{width:100%;border:1px solid var(--line2);border-radius:var(--r);padding:.55rem .75rem .55rem 2.3rem;background:#fff;min-height:2.6rem}
.search .ico{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--mut)}
.sres{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(43,37,35,.15);list-style:none;margin:0;padding:.25rem;z-index:40;max-height:22rem;overflow:auto}
.sres li button{width:100%;text-align:left;border:0;background:none;padding:.5rem .6rem;border-radius:6px;cursor:pointer;display:flex;flex-direction:column}
.sres li button:hover,.sres li button.act{background:var(--bg2)}
.sres small{color:var(--mut);font-size:.8125rem}
.sres .grp{font-size:.6875rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:.4rem .6rem .1rem;font-weight:600}

/* ===== mapa ===== */
body.mode-map{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
body.mode-map #page{display:none}
#mapWrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;background:#EEE8E3}
.map-fallback{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:2rem;color:var(--mut)}
.mtools{position:absolute;top:.75rem;left:.75rem;display:flex;gap:.4rem;flex-wrap:wrap;z-index:5;max-width:calc(100% - 4rem)}
.mtools .btn{box-shadow:0 2px 6px rgba(43,37,35,.15)}
.mtools .btn .n{background:var(--red-t);color:#fff;border-radius:999px;font-size:.75rem;padding:0 .45rem}
.filtros{position:absolute;top:3.75rem;left:.75rem;z-index:6;width:20rem;max-height:calc(100% - 5rem);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(43,37,35,.18);padding:1rem}
.filtros fieldset{border:0;padding:0;margin:0 0 .9rem}
.filtros legend{font-weight:600;font-size:.875rem;margin-bottom:.35rem}
.chk{display:flex;align-items:center;gap:.5rem;padding:.2rem 0;font-size:.9rem;cursor:pointer}
.chk input{width:1.1rem;height:1.1rem;accent-color:var(--red-t)}
.filtros select{width:100%;border:1px solid var(--line2);border-radius:6px;padding:.45rem;background:#fff}
.legenda{position:absolute;left:.75rem;bottom:1.75rem;z-index:5;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:.75rem .9rem;box-shadow:0 4px 14px rgba(43,37,35,.12);max-width:19rem;font-size:.875rem}
.legenda .tot{font-size:1.5rem;font-weight:700;color:var(--red-t);line-height:1}
.legenda ul{list-style:none;margin:.5rem 0;padding:0;display:flex;flex-direction:column;gap:.2rem}
.legenda li{display:flex;justify-content:space-between;gap:1rem}
.legenda .foot{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem;margin-top:.5rem;border-top:1px solid var(--line);padding-top:.5rem}
.amostra{position:absolute;right:.75rem;bottom:1.75rem;z-index:5;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:6px;padding:.25rem .5rem;font-size:.75rem;color:var(--mut);max-width:15rem}
.side{position:absolute;z-index:8;top:.75rem;right:.75rem;bottom:.75rem;width:25rem;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 36px rgba(43,37,35,.22);display:flex;flex-direction:column;overflow:hidden}
.side .grab{display:none}
.side-h{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;padding:1rem 1rem .5rem}
.side-h h2{font-size:1.35rem}
.side-b{padding:0 1rem 1rem;overflow:auto}
.side .pair{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.5rem 0}
.side .pair figure{margin:0}
.side .pair img,.side .pair .noimg{aspect-ratio:3/4;object-fit:cover;width:100%;border-radius:6px}
.side .pair figcaption{font-size:.75rem;color:var(--mut);margin-top:.2rem}
.noimg{display:grid;place-items:center;text-align:center;background:var(--bg2);border:1px dashed var(--line2);color:var(--mut);font-size:.8125rem;padding:.5rem;border-radius:6px}
.side p{margin:.5rem 0}
.side .row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}

/* ===== páginas públicas ===== */
.wrap{max-width:76rem;margin:0 auto;padding:1.25rem 1rem 3rem}
.crumbs{font-size:.8125rem;color:var(--mut);display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.75rem}
.crumbs a{color:var(--mut)}
.rota{font-family:ui-monospace,Consolas,monospace;font-size:.75rem;color:var(--mut);background:var(--bg2);border-radius:4px;padding:.1rem .4rem}
.bloco{padding:2rem 0;border-top:1px solid var(--line)}
.eyebrow{display:block;font-size:.75rem;font-weight:600;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.5rem}
.bloco h2{font-size:1.5rem;margin-bottom:1rem}
.f-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1rem;align-items:start;padding:.5rem 0 1.25rem}
.f-head h1{font-size:clamp(2rem,4.5vw,3.25rem);letter-spacing:-.02em;color:var(--ink)}
.f-head .end{font-size:1.1rem;margin:.4rem 0 .75rem;color:var(--mut)}
.selo-inst{border:2px solid var(--mun);color:var(--mun);border-radius:8px;padding:.5rem .75rem;text-align:center;min-width:8rem}
.selo-inst b{display:block;font-size:1.05rem}
.selo-inst small{font-size:.75rem;font-weight:500}
.selo-inst.est{border-color:var(--est);color:var(--est)} .selo-inst.fed{border-color:var(--fed);color:var(--fed)}
.ex-banner{display:flex;gap:.5rem;align-items:flex-start;background:var(--warn-bg);border:1px solid #E9CF94;color:#6E4A00;padding:.6rem .8rem;border-radius:6px;font-size:.875rem;margin:.5rem 0}
.cmp-tabs{display:flex;gap:.35rem;margin-bottom:.75rem}
.cmp-pair{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.cmp-pair figure{margin:0}
.ph-img{position:relative;aspect-ratio:4/3;background:var(--bg2);border-radius:8px;overflow:hidden;cursor:zoom-in}
.ph-img img{width:100%;height:100%;object-fit:cover}
.ph-img .lab{position:absolute;left:.6rem;top:.6rem;background:var(--ink);color:#fff;font-weight:600;font-size:.8125rem;padding:.15rem .55rem;border-radius:4px}
figcaption.cr{font-size:.8125rem;color:var(--mut);margin-top:.4rem}
.cmp-slider{position:relative;aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:var(--bg2);max-width:56rem}
.cmp-slider img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp-slider .top{clip-path:inset(0 50% 0 0)}
.cmp-slider .bar{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3);pointer-events:none}
.cmp-slider .lab{position:absolute;top:.6rem;background:var(--ink);color:#fff;font-weight:600;font-size:.8125rem;padding:.15rem .55rem;border-radius:4px}
.cmp-range{width:100%;max-width:56rem;accent-color:var(--red-t);margin-top:.5rem}
.prose{max-width:44rem;font-size:1.0625rem;line-height:1.65}
.prose h3{font-size:1.15rem;margin:1.5rem 0 .4rem;color:var(--red-t)}
.prose p{margin:.5rem 0}
.sugbox{border:1px dashed #9DB4D6;background:#F3F7FC;border-radius:8px;padding:.9rem 1rem;margin:1.25rem 0;max-width:44rem;font-size:.9375rem}
.tl{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(9rem,1fr);gap:0;overflow-x:auto;padding-bottom:.5rem}
.tl li{position:relative;padding:1.6rem .9rem 0 0;border-top:3px solid var(--line2)}
.tl li::before{content:"";position:absolute;top:-.55rem;left:0;width:.9rem;height:.9rem;border-radius:50%;background:#fff;border:3px solid var(--red-t)}
.tl li.tb::before{background:var(--red-t)}
.tl b{display:block;font-size:1.25rem;color:var(--red-t)}
.tl span{font-size:.9rem}
.ft{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 2rem;margin:0;max-width:68rem}
.ft div{display:grid;grid-template-columns:11rem minmax(0,1fr);gap:.75rem;padding:.6rem 0;border-bottom:1px solid var(--line)}
.ft dt{color:var(--mut);font-size:.875rem}
.ft dd{margin:0;font-weight:500}
.escala{display:flex;gap:.25rem;margin:.75rem 0;max-width:36rem}
.escala span{flex:1;padding:.4rem .3rem;font-size:.75rem;text-align:center;border-radius:4px;background:var(--bg2);color:var(--mut);border:1px solid var(--line)}
.escala span.on{color:#fff;font-weight:600;border-color:transparent}
.vis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem 2rem;max-width:56rem;margin:0}
.vis div{border-bottom:1px solid var(--line);padding:.6rem 0}
.vis dt{font-size:.875rem;color:var(--mut)} .vis dd{margin:0;font-weight:500}
.ni{font-style:italic;color:var(--mut);font-weight:400}
.loc{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:1.5rem}
#miniMap{height:20rem;border-radius:8px;border:1px solid var(--line);background:#EEE8E3}
.prox{list-style:none;margin:0;padding:0}
.prox li{display:flex;justify-content:space-between;gap:1rem;padding:.6rem 0;border-bottom:1px solid var(--line)}
.refs{max-width:56rem;font-size:.9375rem}
.refs li{margin:.35rem 0}
.share{display:flex;gap:1.5rem;flex-wrap:wrap;align-items:flex-start}
.share .acts{display:flex;flex-direction:column;gap:.5rem}
.permalink{font-family:ui-monospace,Consolas,monospace;font-size:.8125rem;background:var(--bg2);padding:.4rem .6rem;border-radius:6px;word-break:break-all}
.pfoot{border-top:1px solid var(--line);margin-top:2rem;padding:1.5rem 0;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-end;font-size:.8125rem;color:var(--mut)}
.lang{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.lang button{border:0;background:#fff;padding:.35rem .55rem;font-size:.8125rem;font-weight:600;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
/* distrito, roteiro */
.dhead{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:1.5rem;align-items:start}
.dhead h1{font-size:clamp(1.8rem,4vw,2.75rem)}
#ctxMap{height:16rem;border-radius:8px;border:1px solid var(--line);background:#EEE8E3}
.ind{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.5rem;margin:1.5rem 0}
.ind h3{font-size:.9375rem;margin-bottom:.4rem}
.bars{list-style:none;margin:0;padding:0;font-size:.875rem}
.bars li{display:grid;grid-template-columns:minmax(0,1fr) 3rem;gap:.5rem;align-items:center;padding:.15rem 0}
.bars .b{height:.5rem;border-radius:4px;background:var(--line);overflow:hidden;grid-column:1/3}
.bars .b i{display:block;height:100%}
.bars .v{text-align:right;font-weight:600}
.lista{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}

.ed{display:grid;grid-template-columns:13.5rem minmax(0,1fr) 15.5rem;gap:1.25rem;align-items:start}
.ed-nav{position:sticky;top:1rem;font-size:.875rem}

.dl{font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-right:.35rem}
.revlist{list-style:none;margin:0;padding:0}

.rev{display:grid;grid-template-columns:20rem minmax(0,1fr);gap:1.25rem;align-items:start}
.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--line);margin-bottom:1rem}

.tabs button[aria-selected="true"]{color:var(--red-t);border-bottom-color:var(--red-t);font-weight:600}
.sw{display:inline-block;width:1rem;height:1rem;border-radius:3px;vertical-align:middle}
.steps{display:flex;gap:.5rem;margin-bottom:1rem;font-size:.8125rem;color:var(--mut)}
.steps b{color:var(--ink)}
.drop{border:2px dashed var(--line2);border-radius:8px;padding:1.5rem;text-align:center;background:var(--bg)}

/* ===== camada visual v2: materiais, movimento e tipografia ===== */
:root{--red-s:#C8341F;--ease:cubic-bezier(.32,.72,0,1);--glass:rgba(255,255,255,.8);
  --sh-sm:0 1px 2px rgba(43,37,35,.06),0 4px 14px rgba(43,37,35,.08);--sh-lg:0 1px 2px rgba(43,37,35,.06),0 18px 48px rgba(43,37,35,.18)}
h1{letter-spacing:-.028em} h2{letter-spacing:-.015em}
.btn{border-radius:10px;transition:transform .1s ease-out,background-color .15s,border-color .15s,color .15s,box-shadow .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.pri{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 8px rgba(185,46,27,.28)}
.btn.pri:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 4px 14px rgba(185,46,27,.34)}
.ph{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-bottom-color:rgba(43,37,35,.08)}
.logo{border-left:0;padding-left:0;position:relative;padding-left:.8rem}
.logo::before{content:"";position:absolute;left:0;top:.1rem;bottom:.1rem;width:4px;border-radius:2px;background:var(--red)}
.ph nav a{border-radius:999px;transition:background-color .15s,color .15s}
.ph nav a.on{box-shadow:none;border-radius:999px;background:var(--red-bg);color:var(--red-t)}
.search input{background:rgba(246,239,234,.85);border-color:transparent;border-radius:12px;transition:background-color .15s,box-shadow .2s}
.search input:focus{background:#fff;outline:none;box-shadow:0 0 0 3px rgba(29,78,137,.35)}
.sres{border-radius:14px;border-color:rgba(43,37,35,.08);box-shadow:var(--sh-lg);animation:pop .2s var(--ease);transform-origin:top center}
.sres li button{border-radius:10px}
.mtools .btn,.legenda,.amostra,.filtros{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border-color:rgba(255,255,255,.7);box-shadow:var(--sh-sm)}
.mtools .btn{border-radius:999px}
.legenda{border-radius:16px}
.filtros{border-radius:18px;box-shadow:var(--sh-lg);animation:pop .24s var(--ease);transform-origin:top left}
.side{background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-color:rgba(255,255,255,.75);border-radius:20px;box-shadow:var(--sh-lg)}
.side .pair img,.side .pair .noimg{border-radius:10px}
.side.enter{animation:sideIn .5s var(--ease)}
.side.leave{animation:sideOut .26s ease-in forwards}
@keyframes sideIn{from{transform:translateX(36px);opacity:0}}
@keyframes sideOut{to{transform:translateX(36px);opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(-4px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
#toast{border-radius:999px;background:rgba(43,37,35,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:.65rem 1.2rem;animation:toastIn .4s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px) scale(.98)}}
dialog{border:0;border-radius:20px;box-shadow:var(--sh-lg)}
dialog[open]{animation:pop .28s var(--ease)}
dialog::backdrop{background:rgba(43,37,35,.42);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
/* capa */
.capa-l{background:var(--red-s);position:relative;overflow:hidden}
.capa-l h1{letter-spacing:-.035em}
.capa-foto{margin:0;flex:1 1 0;min-height:7rem;display:flex;flex-direction:column;gap:.4rem}
@media (min-width:900px){.capa{height:100dvh;min-height:40rem}.capa-l{gap:1.1rem;padding-top:2.5rem;padding-bottom:2rem}}
.capa-foto img{flex:1;min-height:0;width:100%;object-fit:cover;object-position:50% 35%;border-radius:16px;filter:grayscale(1) contrast(1.05);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.capa-foto figcaption{font-size:.8125rem;font-weight:500}
.ph-img img[src*="1-15787"],.cmp-slider img[src*="1-15787"],.imgrow .th img[src*="1-15787"],.crop img[src*="1-15787"],.capa-crop img{transform:scale(1.2);transform-origin:50% 40%} /* postal de 1939: esconde a moldura e a régua de cor do scan */
.crop{overflow:hidden;border-radius:6px} .crop img{display:block}
.capa-crop{flex:1;min-height:0;overflow:hidden;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.capa-crop img{width:100%;height:100%;object-fit:cover;object-position:50% 35%;filter:grayscale(1) contrast(1.05);display:block}
.ph-img.noimg{aspect-ratio:auto;min-height:9rem}
.dl-imp div{grid-template-columns:minmax(0,1fr) auto!important}
.capa-l > *{animation:rise .6s var(--ease) both}
.capa-l > *:nth-child(2){animation-delay:.05s} .capa-l > *:nth-child(3){animation-delay:.1s} .capa-l > *:nth-child(4){animation-delay:.15s} .capa-l > *:nth-child(5){animation-delay:.2s}
.capa-r h2{font-size:1.4rem;letter-spacing:-.02em}
.perfis{border-top:0;gap:.5rem}
.perfis button{border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;background:#fff;transition:background-color .15s,border-color .15s,box-shadow .2s,transform .1s ease-out}
.perfis button:hover{background:#fff;border-color:var(--line2);box-shadow:var(--sh-sm)}
.perfis button:active{transform:scale(.985)}
.perfis .ar{transition:transform .3s var(--ease)}
.perfis button:hover .ar{transform:translateX(4px)}
.perfis button.pub{border-color:rgba(185,46,27,.35);background:var(--red-bg)}
/* ficha e páginas públicas */
.f-head h1{letter-spacing:-.035em}
.ph-img,.cmp-slider{border-radius:16px}
.ph-img img{transition:transform .7s var(--ease)}
.ph-img:hover img{transform:scale(1.025)}
.ph-img .lab,.cmp-slider .lab{background:rgba(43,37,35,.7);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:999px;padding:.2rem .7rem}
.bloco{border-top-color:rgba(43,37,35,.08)}
.selo-inst{border-radius:16px}
.ex-banner,.sugbox,.lgpd{border-radius:12px}
.tl b{letter-spacing:-.02em}
#miniMap,#ctxMap,#rotMap{border-radius:16px}
.prose h3{letter-spacing:-.01em}
/* painel */
.box{border-radius:14px;border-color:rgba(43,37,35,.09);box-shadow:0 1px 2px rgba(43,37,35,.04)}
.adm-side{background:#231E1C}
.adm-side nav a{border-radius:10px;transition:background-color .15s}
.adm-main > *{animation:rise .35s var(--ease) both}
.field input,.field select,.field textarea{border-radius:10px;transition:border-color .15s,box-shadow .2s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--fed);box-shadow:0 0 0 3px rgba(29,78,137,.2)}
.revlist li button{transition:background-color .15s}
@media (max-width:899px){
  .side{max-height:calc(100% - .5rem);border-radius:22px 22px 0 0;border-bottom:0;will-change:transform}
  .side .grab,.side .side-h{touch-action:none;cursor:grab}
  .ph nav a{padding:.4rem .5rem}
  .side .grab{width:2.75rem;height:.32rem;margin:.6rem auto .1rem;background:rgba(43,37,35,.22)}
  .capa-foto{flex:none;height:12rem}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
@media (prefers-reduced-transparency:reduce){.ph,.mtools .btn,.legenda,.amostra,.filtros,.side{-webkit-backdrop-filter:none;backdrop-filter:none;background:#fff}}
.ico.on{fill:currentColor}
.btn.fav[aria-pressed="true"]{color:var(--red-t);border-color:rgba(185,46,27,.4);background:var(--red-bg)}
.ph nav a{white-space:nowrap;flex:none}
.ph nav a.conta{margin-left:auto;display:inline-flex;gap:.35rem;align-items:center}
.ph nav a.conta .n{background:var(--red-t);color:#fff;border-radius:999px;font-size:.75rem;padding:0 .45rem}
.salvos{list-style:none;margin:0;padding:0;max-width:48rem}
.salvos li{display:grid;grid-template-columns:5rem minmax(0,1fr) auto;gap:1rem;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--line)}
.salvos .th{width:5rem;height:4rem;border-radius:10px;overflow:hidden;background:var(--bg2)}
.salvos .th img{width:100%;height:100%;object-fit:cover}
.rcards{list-style:none;margin:1.5rem 0 2rem;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:1rem}
.rcard{display:flex;flex-direction:column;gap:.75rem;height:100%;padding:1.25rem;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);text-decoration:none;transition:transform .25s cubic-bezier(.32,.72,0,1),box-shadow .25s}

.rc-st{list-style:none;margin:0;padding:0;display:grid;gap:.35rem;counter-reset:s;font-size:.9rem}
.rc-st li{counter-increment:s;display:flex;gap:.5rem;align-items:center}
.rc-st li::before{content:counter(s);width:1.4rem;height:1.4rem;border-radius:50%;background:var(--red-t);color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center;flex:none}

.roted{padding:1.25rem}

.roted .paradas textarea{width:100%;font:inherit;font-size:.95rem;padding:.5rem .65rem;border:1px solid var(--line2);border-radius:8px;resize:vertical;margin-top:.5rem}
.addp{position:relative;margin:1rem 0 .25rem;max-width:36rem}

<p>Foi o segundo arranha-céu do Brasil entre 1934 e 1947 (e, durante um tempo, o mais alto da América Latina), idealizado pelo italiano Giuseppe Martinelli e projetado pelo arquiteto húngaro Vilmos (William) Fillinger (1888-1968), formado na Academia de Belas-Artes de Viena.</p>
<p>A obra começou em 1924. O prédio foi inaugurado ainda inacabado, em 1929, e concluído em 1934, com 30 andares e 105 metros de altura. Em São Paulo, só foi superado em 1947, pelo Edifício Altino Arantes.</p>
<h3>Análise arquitetônica</h3>
<p>De linguagem eclética, o edifício ocupa o triângulo formado pela Rua São Bento, pela Avenida São João e pela Rua Líbero Badaró. A estrutura combina concreto e alvenaria de tijolos, e o volume se escalona até o topo, onde Martinelli instalou a própria residência.</p>
<h3>Valores de preservação</h3>
<p>O Martinelli marca o início da verticalização do centro de São Paulo e a passagem da cidade de capital do café a metrópole. Desapropriado pela Prefeitura em 1975 e reformado até 1979, foi tombado pelo Conpresp em 1992, no conjunto do Vale do Anhangabaú, com nível de proteção 2.</p>`,

  [MART.texto]:`<h3>Historical context</h3>
<p>Between 1934 and 1947 it was Brazil’s second skyscraper (and, for a time, the tallest in Latin America). It was conceived by the Italian Giuseppe Martinelli and designed by the Hungarian architect Vilmos (William) Fillinger (1888–1968), a graduate of the Academy of Fine Arts Vienna.</p>
<p>Construction began in 1924. The building opened in 1929, while still unfinished, and was completed in 1934, with 30 floors and a height of 105 meters. In São Paulo, it was only surpassed in 1947, by the Edifício Altino Arantes.</p>
<h3>Architectural analysis</h3>
<p>Eclectic in style, the building occupies the triangle formed by Rua São Bento, Avenida São João and Rua Líbero Badaró. Its structure combines concrete and brick masonry, and its mass steps back as it rises toward the top, where Martinelli set up his own residence.</p>
<h3>Heritage values</h3>
<p>The Martinelli marks the beginning of the vertical growth of downtown São Paulo and the city’s shift from coffee capital to metropolis. Expropriated by the City of São Paulo in 1975 and renovated until 1979, it was listed by Conpresp in 1992 as part of the Vale do Anhangabaú ensemble, with protection level 2.</p>`

function rotStats(r) {
  const st = r.paradas.map(p => BY[p[0]]); let m = 0; for (let i = 1; i < st.length; i++) m += dist([st[i - 1].lng, st[i - 1].lat], [st[i].lng, st[i].lat]);
  const km = m * 1.3 / 1000; // shortcut: distância em linha reta × 1,3 como estimativa a pé; no sistema, usar rota real
  return { km:km.toFixed(1).replace('.', ','), min:Math.max(5, Math.round(km / 4.5 * 60 / 5) * 5), st };
}

    document.body.className = 'mode-map'; $('#hdr').innerHTML = hdr('mapa'); $('#page').innerHTML = ''; $('#mapWrap').hidden = false;
    if (mudou) filtrosDaURL(); pgMapa(); document.title = 'Mapa dos bens tombados · Encontro com o Patrimônio';

  }
}
